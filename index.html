    <style>
      * {
        margin: 0;
        padding: 0;

      }

      body {

          BlinkMacSystemFont,

      }

      #root {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        background: #f0fdf4;
      }

      @media (display-mode: standalone) {
        body {
          padding: 0;
        }

        #root {
          min-height: 100vh;
          padding: 0;
        }
      }

      /* Subtle interactive effects */
      button {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      button:active {
        transform: scale(0.96);
      }
      input {
        transition: all 0.2s ease-in-out;
      }
      input:focus {
        background: #e8f7f0 !important;
      }
      input::placeholder {
        color: #7ba898;
        font-family: "Inter";
        font-size: 11.6px;
        font-weight: 400;
      }

      /* Hide scrollbar for clean mobile feel */
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Application success animation — total loop 2.8s, stagger baked into % */
      @keyframes ringOuterLoop {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        18% {
          transform: scale(1.18);
          opacity: 1;
        }
        22% {
          transform: scale(1);
          opacity: 1;
        }
        70% {
          transform: scale(1);
          opacity: 1;
        }
        86% {
          transform: scale(0.8);
          opacity: 0;
        }
        100% {
          transform: scale(0);
          opacity: 0;
        }
      }
      @keyframes ringMidLoop {
        0%,
        4.3% {
          transform: scale(0);
          opacity: 0;
        }
        22.3% {
          transform: scale(1.18);
          opacity: 1;
        }
        26.3% {
          transform: scale(1);
          opacity: 1;
        }
        70% {
          transform: scale(1);
          opacity: 1;
        }
        86% {
          transform: scale(0.8);
          opacity: 0;
        }
        100% {
          transform: scale(0);
          opacity: 0;
        }
      }
      @keyframes ringInnerLoop {
        0%,
        8.6% {
          transform: scale(0);
          opacity: 0;
        }
        26.6% {
          transform: scale(1.18);
          opacity: 1;
        }
        30.6% {
          transform: scale(1);
          opacity: 1;
        }
        70% {
          transform: scale(1);
          opacity: 1;
        }
        86% {
          transform: scale(0.8);
          opacity: 0;
        }
        100% {
          transform: scale(0);
          opacity: 0;
        }
      }
      @keyframes checkLoop {
        0%,
        20.7% {
          stroke-dashoffset: 52;
          opacity: 0;
        }
        34.3% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        70% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        86% {
          stroke-dashoffset: 0;
          opacity: 0;
        }
        100% {
          stroke-dashoffset: 52;
          opacity: 0;
        }
      }
      .success-ring-outer {
        animation: ringOuterLoop 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .success-ring-mid {
        animation: ringMidLoop 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .success-ring-inner {
        animation: ringInnerLoop 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .success-check {
        stroke-dasharray: 52;
        animation: checkLoop 2.8s ease-in-out infinite;
      }
    </style>

      function getStatusStyle(status) {
        if (status === "Applied") return { bg: "#EEF2FF", color: "#6366F1" };
        if (status === "Review") return { bg: "#F1F5F9", color: "#64748B" };
        if (status === "Approved") return { bg: "#ECFDF5", color: "#059669" };
        if (status === "Rejected") return { bg: "#FFF1F2", color: "#F43F5E" };
        if (status === "In Review") return { bg: "#F1F5F9", color: "#64748B" };
        return { bg: "#F1F5F9", color: "#64748B" };
